<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#075E54" />
  <meta name="description" content="Archivio della conversazione" />
  <title>Chat</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="app">

    <header class="chat-header">
      <div class="avatar" aria-hidden="true">💬</div>
      <div class="header-info">
        <h1 id="chat-title">Chat</h1>
        <p id="chat-subtitle">Caricamento…</p>
      </div>
      <button id="search-toggle" class="icon-btn" type="button" aria-label="Cerca nei messaggi" aria-expanded="false">
        <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true">
          <path fill="currentColor" d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.5 4.5 0 0 1 9.5 14z"/>
        </svg>
      </button>
    </header>

    <div id="search-bar" class="search-bar" hidden>
      <input type="text" id="search-input" placeholder="Cerca nei messaggi…" aria-label="Cerca nei messaggi" autocomplete="off" />
      <span id="search-counter" class="search-counter"></span>
      <button id="prev-btn" class="icon-btn small" type="button" aria-label="Risultato precedente" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7.41 15.41 12 10.83l4.59 4.58L18 14l-6-6-6 6z"/></svg>
      </button>
      <button id="next-btn" class="icon-btn small" type="button" aria-label="Risultato successivo" disabled>
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
      </button>
      <button id="search-close" class="icon-btn small" type="button" aria-label="Chiudi ricerca">
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path fill="currentColor" d="M19 6.41 17.59 5 12 10.59 6.41 5 5 6.41 10.59 12 5 17.59 6.41 19 12 13.41 17.59 19 19 17.59 13.41 12z"/></svg>
      </button>
    </div>

    <main id="chat-container" class="chat-container">
      <div id="sticky-date" class="sticky-date" hidden></div>
      <div id="loading" class="state-message">Caricamento chat…</div>
      <div id="empty-state" class="state-message" hidden>Nessun messaggio trovato</div>
      <div id="messages" class="messages" hidden></div>
    </main>

    <button id="jump-latest" class="jump-latest" type="button" hidden aria-label="Vai all'ultimo messaggio">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path fill="currentColor" d="M7.41 8.59 12 13.17l4.59-4.58L18 10l-6 6-6-6z"/></svg>
    </button>

  </div>

  <div id="lightbox" class="lightbox" hidden>
    <button id="lightbox-close" class="lightbox-close" type="button" aria-label="Chiudi anteprima">✕</button>
    <img id="lightbox-img" src="" alt="Immagine ingrandita" />
    <div id="lightbox-error" class="lightbox-error" hidden></div>
  </div>

  <!--
    Contatore di visite invisibile (hits.sh, nessun account richiesto).
    Non mostra nulla sulla pagina: conta solo ogni volta che qualcuno apre il sito.
    Per vedere il numero di visite in qualsiasi momento, apri in una nuova scheda
    lo stesso indirizzo qui sotto ma sostituendo ".svg" con "/" alla fine, es:
    https://hits.sh/TUO-USERNAME.github.io/TUO-REPO/
  -->
  <img src="https://hits.sh/TUO-USERNAME.github.io/TUO-REPO.svg" alt="" aria-hidden="true" class="visually-hidden" />

  <script src="chat-data.js"></script>
  <script src="app.js"></script>
</body>
</html>
